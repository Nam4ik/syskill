name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
        os: ubuntu

    steps:
    - uses: actions/checkout@v4

    - name: Setup environment 
      run: apt install -y libasound2-dev libx11-dev

    - name: Build 
      run: cargo build --verbose --release

    - name: Test 
      run: cargo test --verbose